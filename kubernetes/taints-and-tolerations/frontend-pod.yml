apiVersion: v1
kind: Pod
metadata:
  name: frontend-pod
  labels:
    app.kubernetes.io/name: frontend
spec:
  # nodeName: minikube
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        memory: "100Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
