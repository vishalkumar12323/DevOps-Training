apiVersion: v1 
kind: ServiceAccount
metadata:
  name: blogzine-service-account
  namespace: rbac-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blogzine-role-binding
subjects:
  - kind: ServiceAccount
    name: blogzine-service-account
    namespace: rbac-demo
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io