apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: blogzine-db
  namespace: rbac-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blogzine-db
  serviceName: database-service
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blogzine-db
    spec:
      containers:
      - name: mongodb-container
        image: mongo:latest
        envFrom:
          - secretRef:
              name: mongodb-secrets
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-ps
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongo-ps
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 500Mi
