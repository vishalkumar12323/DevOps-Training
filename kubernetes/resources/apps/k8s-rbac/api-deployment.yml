apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogzine-api
  namespace: rbac-demo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blogzine-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blogzine-api
    spec:
      containers:
      - name: blogzine-api-container
        image: vishaldoc502/blogzine:prod-v2
        envFrom:
          - configMapRef:
              name: api-config
          - secretRef:
              name: api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

      - name: kube-rbac-proxy
        image: quay.io/brancz/kube-rbac-proxy:v0.23.1
        args:
          - "--secure-listen-address=0.0.0.0:8443"
          - "--upstream=http://127.0.0.1:8080/"
          - "--config-file=/etc/kube-rbac-proxy/config-file.yaml"
          - "--logtostderr=true"
          - "--v=10"
        ports:
          - containerPort: 8443
            name: https
        resources:
          requests:
            memory: "100Mi"
            cpu: "150m"
          limits:
            memory: "100Mi"
            cpu: "150m"
