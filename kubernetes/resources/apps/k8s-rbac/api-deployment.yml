apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogzine-api
spec:
  selector:
    matchLabels:
      app: blogzine-api
  template:
    metadata:
      labels:
        app: blogzine-api
    spec:
      containers:
      - name: blogzine-api-container
        image: vishaldoc502/blogzine:prod-v2
        envForm:
          - configMapRef:
              name: api-config
          - secretRef:
              name: api-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
