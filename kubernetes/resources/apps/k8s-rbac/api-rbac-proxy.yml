## Service Account Defination
apiVersion: v1 
kind: ServiceAccount
metadata:
  name: blogzine-api-proxy
  namespace: rbac-demo
---
## Cluster Role Defination
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blogzine-api-proxy-role
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"] 
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"] 
  verbs: ["create"]
---
## ClusterRole (blogzine-api-proxy-role) binding to ServiceAccount (blogzine-api-proxy)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blogzine-api-proxy-role-binding
subjects:
  - kind: ServiceAccount
    name: blogzine-api-proxy
    namespace: rbac-demo
roleRef:
  kind: ClusterRole
  name: blogzine-api-proxy-role
  apiGroup: rbac.authorization.k8s.io