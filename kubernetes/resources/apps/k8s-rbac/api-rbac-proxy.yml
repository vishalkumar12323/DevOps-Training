apiVersion: v1 
kind: ServiceAccount
metadata:
  name: blogzine-api-proxy
  namespace: rbac-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blogzine-api-proxy-binding
subject:
  - kind: ServiceAccount
    name: blogzine-api-proxy
    namespace: rbac-demo
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io