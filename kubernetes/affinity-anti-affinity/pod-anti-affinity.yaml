apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: affinity-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app 
                    operator: In
                    values:
                      - web-app
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web-app
        image: nginx:latest
        resources:
          requests:
            memory: "100Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
