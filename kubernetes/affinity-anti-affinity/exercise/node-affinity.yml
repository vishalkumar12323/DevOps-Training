apiVersion: v1
kind: Pod
metadata:
  name: node-affinity
  namespace: affinity-demo
  labels:
    app.kubernetes.io/name: node-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disk
                operator: In 
                values:
                  - hdd
  containers:
  - name: node-affinity
    image: nginx:latest
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "500Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
