apiVersion: v1
kind: Pod
metadata:
  name: nginx-scheduled
  namespace: sch-demo
  labels:
    app.kubernetes.io/name: nginx-scheduled
spec:
  nodeSelector:
    environment: production
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
    ports:
      - containerPort: 80
