apiVersion: v1
kind: Pod
metadata:
  name: nginx-scheduled
  namespace: sch-demo
  labels:
    app: nginx-scheduledv1
spec:
  nodeSelector:
    environment: production
  containers:
  - name: nginx
    image: nginx:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "264Mi"
    ports:
      - containerPort: 80
