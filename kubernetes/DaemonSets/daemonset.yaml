apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: daemonset-demo
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      # nodeSelector:
      #   environment: production
      # tolerations:
      #   - key: "dedicated"
      #     operator: "Equal"
      #     value: "monitoring"
      #     effect: "NoSchedule"
      containers:
        - name: agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                echo "Node agent is running..."
                sleep 30
              done