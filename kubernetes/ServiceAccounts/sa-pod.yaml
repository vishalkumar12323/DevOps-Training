apiVersion: v1
kind: Pod

metadata:
  name: api-client
  namespace: sa-demo

spec:
  serviceAccountName: pod-inspector

  containers:
    - name: api-client
      image: curlimages/curl:8.12.1
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "200Mi"
          cpu: "200m"