apiVersion: v1
kind: Pod

metadata:
  name: frontend-client
  namespace: sa-demo

spec:
  automountServiceAccountToken: false

  containers:
    - name: frontend
      image: curlimages/curl:8.12.1
      command: ["sleep", "3600"]

      resources:
        requests:
          memory: "100Mi"
          cpu: "100m"
        limits:
          memory: "200Mi"
          cpu: "200m"